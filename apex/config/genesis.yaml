# genesis.yaml - Everything in one place

intelligence:
  brain:
    architecture_search:
      population_size: 20
      generations: 10
      mutation_rate: 0.15
    base_model: "temporal_fusion_transformer"
    evolution_frequency: "daily"

  patterns:
    wavelet_levels: [1, 2, 4, 8, 16]
    attention_heads: 8
    regime_detection: true
    technical_indicators:
      rsi: { enabled: true, window: 14 }
      macd: { enabled: true, window_slow: 26, window_fast: 12, window_sign: 9 }
      bollinger_bands: { enabled: true, window: 20, window_dev: 2 }
      atr: { enabled: true, window: 14 }
      adx: { enabled: true, window: 14 }

  strategies:
    genome_length: 12
    population: 50
    elite_percentage: 0.2
    mutation_rate: 0.1

reality:
  data_sources:
    primary: "mock"
    validation: "multiple_exchanges"

  risk:
    max_drawdown: 0.15
    position_sizing: "kelly_criterion"
    stop_loss: "adaptive_atr"

evolution:
  self_modification:
    enabled: false # Disabled for now to focus on core logic
    safety_checks: true
    sandbox_testing: true
  performance_threshold: 0.02
  knowledge_retention:
    max_memory: "10000_predictions"
    compression: "pattern_clustering"

execution:
  mode: "terminal"
  verbosity: "intelligent"
  update_frequency: "real_time"
  max_cycles: 100 # Max number of cycles to run (0 for infinite)
  save_state_frequency: 25 # Save state every 25 cycles
